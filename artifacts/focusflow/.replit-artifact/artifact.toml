kind = "web"
previewPath = "/"
title = "FocusFlow"
version = "1.0.0"
id = "artifacts/focusflow"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20417

[services.development]
run = "pnpm --filter @workspace/focusflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/focusflow", "run", "build" ]
serve = "static"
publicDir = "artifacts/focusflow/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20417"
BASE_PATH = "/"
